[package]
name = "galileo-rs"
version = "0.3.0"
edition = "2024"
description = "Galileo computer algebra system, in Rust"
license = "Apache-2.0"
repository = "https://github.com/cascala/galileo-rs"

[lib]
name = "galileo_rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "galileo"
path = "src/bin/galileo.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
