[package]
name = "galileo-rs"
version = "0.3.1"
edition = "2024"
description = "Galileo computer algebra system, in Rust"
license = "Apache-2.0"
repository = "https://github.com/cascala/galileo-rs"

[lib]
name = "galileo_rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "galileo"
path = "src/bin/galileo.rs"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint", "std"] }
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
